name: Capture Josyenne Rodrigues portfolio hero
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/josy-capture/**'
      - '.github/workflows/capture-josy.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install capture tools
        run: |
          npm install --prefix .github/josy-capture --no-save --no-package-lock playwright sharp
          .github/josy-capture/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture the website header and hero
        run: node .github/josy-capture/capture.mjs
      - name: Commit fixed image to GitHub
        run: |
          git add client/public/assets/project-hero-josyenne.webp
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "assets(portfolio): adicionar hero real Josyenne Rodrigues"
            git push origin HEAD:main
          fi
